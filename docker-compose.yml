services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ssh_sync
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8082:8082"
      - "9090:9090" 
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/ssh:/root/.ssh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./ssh-sync-service", "backend"]

  scheduler:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/ssh:/root/.ssh
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: ["./ssh-sync-service", "scheduler", "--backend=http://backend:8082"]

  worker:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/ssh:/root/.ssh
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: ["./ssh-sync-service", "worker", "--backend=http://backend:8082", "--data-dir=/app/data"]

  frontend:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: