services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ssh_sync
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ssh-sync-service:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/ssh:/root/.ssh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - ssh-sync-service
    restart: unless-stopped

volumes:
  postgres_data: