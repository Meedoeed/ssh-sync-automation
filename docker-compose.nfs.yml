version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ssh-network

  backend:
    build: .
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - nfs_shared_data:${NFS_MOUNT}
      - ./data/ssh:/root/.ssh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./ssh-sync-service", "backend"]
    networks:
      - ssh-network

  scheduler:
    build: .
    env_file:
      - .env
    volumes:
      - nfs_shared_data:${NFS_MOUNT}
      - ./data/ssh:/root/.ssh
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: ["./ssh-sync-service", "scheduler", "--backend=http://backend:8082"]
    networks:
      - ssh-network

  worker:
    build: .
    env_file:
      - .env
    environment:
      - WORKER_ID=worker-${HOSTNAME}-${REPLICA:-1}
    volumes:
      - nfs_shared_data:${NFS_MOUNT} 
      - ./data/ssh:/root/.ssh
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: ["./ssh-sync-service", "worker", "--backend=${BACKEND_URL:-http://backend:8082}", "--data-dir=${NFS_MOUNT}"]
    networks:
      - ssh-network
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ssh-network

volumes:
  postgres_data:
    driver: local

  nfs_shared_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nolock,soft,rw,timeo=30,retrans=3
      device: ${NFS_PATH}

networks:
  ssh-network:
    driver: bridge